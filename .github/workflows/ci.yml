name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy src/trading_radar
      - run: uv run --no-sync pytest --cov=trading_radar --cov-report=term-missing
  container:
    runs-on: ubuntu-latest
    needs: checks
    env:
      IMAGE: trading-radar-ci:${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_VOLUME: trading-radar-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration without credentials
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build runtime image from the lock
        run: docker build --tag "$IMAGE" .
      - name: Exercise isolated recovery without network access
        run: |
          docker volume create "$SMOKE_VOLUME"
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=volume,src=$SMOKE_VOLUME,dst=/app/data" \
            --entrypoint python "$IMAGE" scripts/smoke_container.py
      - name: Remove this run's synthetic volume
        if: always()
        run: docker volume rm "$SMOKE_VOLUME" || test -z "$(docker volume ls --quiet --filter "name=^${SMOKE_VOLUME}$")"
