name: immortal-trading-dashboard
services:
  dashboard:
    image: ${DASHBOARD_IMAGE:?Set the validated live dashboard image}
    restart: unless-stopped
    init: true
    network_mode: host
    read_only: true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=700
    # Only this private gateway configuration is supplied; no Telegram credentials.
    env_file: .env.dashboard-editor
    environment:
      DATABASE_URL: sqlite:////app/data/jobs.db
      ALERTS_ENABLED: "false"
      TELEGRAM_CONTROL_ENABLED: "false"
      # Read-only radar policy metadata; this service still has no notifier credentials.
      DASHBOARD_RADAR_ALERTS_ENABLED: ${DASHBOARD_RADAR_ALERTS_ENABLED:-false}
    volumes:
      - type: bind
        source: ${RADAR_DATA_DIR:?Set the existing persistent data directory}
        target: /app/data
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [trading-radar]
    command: [dashboard, serve, --private-editor, --port, "8765"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=15); assert r.status==200"]
      interval: 1m
      timeout: 20s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  https:
    image: ${CADDY_IMAGE:?Set an official Caddy image pinned by digest}
    restart: unless-stopped
    init: true
    network_mode: host
    # Host ports 80/443 require this UID with only NET_BIND_SERVICE retained.
    user: "0:0"
    read_only: true
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp:uid=0,gid=0,mode=700
      - /config:uid=0,gid=0,mode=700
    volumes:
      - type: bind
        source: ${DASHBOARD_WEB_DIR:?Set the existing private web directory}/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DASHBOARD_WEB_DIR:?Set the existing private web directory}/caddy-data
        target: /data
        bind:
          create_host_path: false
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      dashboard: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
