# Start small. Other employers are tracked in docs/ROADMAP.md.
companies:
  nomura_professionals:
    name: Nomura
    enabled: true
    ats: nomura_professionals
    career_url: https://careers.nomura.com/Nomura?locale=en_US
    country: global
    options:
      search_terms: [trading]
      title_terms: [trading, trader, etrading, markets, structuring, structurer, repo, securities finance]
    notes: Public SuccessFactors search and complete descriptions verified 2026-09-17. Trading search, pages of 100, first-page recheck, title filter including eTrading; Operations division excluded. Corporate grade and explicit experience minima retained. No deadline inferred from validThrough; no closure by absence.
  hsbc_professionals:
    name: HSBC
    enabled: true
    ats: hsbc_professionals
    career_url: https://portal.careers.hsbc.com/careers
    country: global
    options:
      search_terms: [trading]
    notes: Public Eightfold search and JobPosting details verified 2026-09-17. Trading query, pagination of 10, first-page recheck and title filter. Intl Wealth & Premier Banking excluded. Platform dates without timezone are not publication/deadline instants. No closure by absence.
  ubs_professionals:
    name: UBS
    enabled: true
    ats: ubs
    career_url: https://jobs.ubs.com/TGnewUI/Search/home/HomeWithPreLoad?partnerid=25008&siteid=5012&PageType=searchResults&SearchType=linkquery&LinkID=15231
    country: global
    notes: Public professional board verified 2026-09-17; 547 listings, full pagination then Trading/Markets title filter. Separate source from campus, shared employer identity. No inferred seniority or dates; no closure by absence.
